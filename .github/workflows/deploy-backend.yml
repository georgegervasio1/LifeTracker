name: Deploy backend to Cloud Run

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # needed for keyless auth to Google Cloud

env:
  REGION: us-east4
  SERVICE: lifetracker-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keyless auth via Workload Identity Federation (no JSON key stored in GitHub)
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          source: ./backend
          env_vars: |
            PLAID_ENV=sandbox
            FRONTEND_ORIGIN=https://georgegervasio1.github.io
          secrets: |
            PLAID_CLIENT_ID=plaid-client-id:latest
            PLAID_SECRET=plaid-secret:latest
            ALLOWED_EMAIL=allowed-email:latest
